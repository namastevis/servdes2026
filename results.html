<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Results – Poster voting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.logo{width:130px}
h1{font-size:32px;letter-spacing:-.02em;margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.stats{display:flex;gap:28px;margin-bottom:24px;flex-wrap:wrap}
.stats div b{display:block;font-size:30px;line-height:1}
.stats div span{color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:28px 44px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row .rank{font-weight:800;color:var(--muted);text-align:right}
.row img{width:44px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.row .name{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.row .name small{color:var(--muted);font-weight:500}
.track{height:10px;background:var(--wash);border-radius:99px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--indigo);border-radius:99px;transition:width .6s}
.row.top .fill{background:var(--magenta)}
.row.top .rank{color:var(--magenta)}
.err{background:#FDECEA;color:var(--err);padding:12px 14px;border-radius:12px}
.updated{color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/servdes-logo.png" alt="ServDes India">
  <h1>Poster voting results</h1>
  <p class="sub" id="sub">Updates every 15 seconds.</p>
  <div class="stats">
    <div><b id="voters">–</b><span>delegates voted</span></div>
    <div><b id="delegates">–</b><span>on the delegate list</span></div>
    <div><b id="state">–</b><span>voting</span></div>
  </div>
  <div id="list"></div>
  <div class="updated" id="updated"></div>
</main>
<script src="config.js"></script>
<script src="posters.js"></script>
<script>
(function(){
  const key = new URLSearchParams(location.search).get("key") || "";
  const byId = Object.fromEntries(window.POSTERS.map(p => [p.id, p]));
  const list = document.getElementById("list");
  async function load(){
    let res;
    try{
      const r = await fetch(window.VOTE_CONFIG.API_URL + "?action=results&key=" + encodeURIComponent(key));
      res = await r.json();
    }catch(e){ res = { ok:false, error:"network" }; }
    if(!res.ok){
      list.innerHTML = `<div class="err">${res.error === "forbidden"
        ? "This results link needs the organiser key. Open results.html?key=YOUR_KEY."
        : "Couldn't reach the voting server. Retrying in 15 seconds."}</div>`;
      return;
    }
    document.getElementById("voters").textContent = res.voters;
    document.getElementById("delegates").textContent = res.delegates;
    document.getElementById("state").textContent = res.open ? "Open" : "Closed";
    const rows = Object.entries(res.counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
    const max = Math.max(1, ...rows.map(r => r[1]));
    let rank = 0, prev = null;
    list.innerHTML = rows.map(([id,n],i) => {
      if(n !== prev){ rank = i+1; prev = n; }
      const p = byId[id] || { team:id, title:"" };
      return `<div class="row ${rank<=3 && n>0 ? "top" : ""}">
        <div class="rank">${rank}</div>
        <img src="posters/${id}-thumb.jpg" alt="">
        <div><div class="name"><span>${p.team} <small>· ${id}</small></span><span>${n}</span></div>
        <div class="track"><div class="fill" style="width:${n/max*100}%"></div></div></div></div>`;
    }).join("");
    document.getElementById("updated").textContent = "Last updated " + new Date().toLocaleTimeString("en-IN");
  }
  load(); setInterval(load, 15000);
})();
</script>
</body>
</html>
